name: forex-web
services:
  # База данных PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: forex-postgres
    environment:
      POSTGRES_DB: forex
      POSTGRES_USER: forex_user
      POSTGRES_PASSWORD: forex_password
      POSTGRES_ROOT_PASSWORD: root_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forex_user -d forex"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer для управления БД (опционально)
  adminer:
    image: adminer:latest
    container_name: forex-adminer
    ports:
      - "8080:8080"
    networks:
      - forex-network
    depends_on:
      - postgres

  web:
    build: .
    container_name: forex-web
    volumes:
      - ./src:/var/www/html
    networks:
      - forex-network
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=forex
      - DB_USERNAME=forex_user
      - DB_PASSWORD=forex_password
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: forex-nginx
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - forex-network
    depends_on:
      - web

networks:
  forex-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local